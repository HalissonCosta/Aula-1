<!DICTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Margem, Padding e Border</title>
        <style>
            /* 0 0 0 0 */
            div {
                background: hotpink;
                color: white;

                margin: 30px 60px 90px 120px;
                padding: 100px 80px 40px 20px; 

                border-top: 10px solid indigo;
                border-right: 15px solid indigo;
                border-bottom: 20px solid indigo;
                border-left: 25px solid indigo;
            }
        </style>
    </head>
    <body>
        <div>
            Texto
        </div>
    </body>
</html>
