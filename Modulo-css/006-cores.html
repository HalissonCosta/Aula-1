<!DOCTYPE html>
<html lang=""pt-br">
    <head>
        <meta charset=""UTF-8" />
        <title>Css</title>
        <style>
          div {
            color:darkgrey;
            padding: 30px;
            text-align: center;
          }
          
          div:nth-child(1) {
            background:  #c71f37;
          }  

          div:nth-child(2) {
            background:  #ffff3f;
          }

          div:nth-child(3) {
            background:  #0d47a1;
          }
         </style>
    </head>

    <body>

        <div>
            #c71f37
        </div>

        <div>
            #ffff3f
        </div>

        <div>
            #0d47a1
        </div>
    </body>
</html>
